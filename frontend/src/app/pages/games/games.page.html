<div class="container">
    <app-header></app-header>
    <main>
        <div class="main-container">
            <div class="content">
                <div class="pagination">
                    <div class="left">
                        <button class="pagination-left">
                            <arrow-left-icon></arrow-left-icon>
                        </button>
                        <div class="pages">
                            <button>1</button>
                            <button>2</button>
                            <button>3</button>
                            <button>...</button>
                            <button>993</button>
                        </div>
                        <button class="pagination-right">
                            <arrow-right-icon></arrow-right-icon>
                        </button>
                    </div>
                    <div class="right">
                        <button (click)="setPageSize(6)">6</button>
                        <button (click)="setPageSize(12)">12</button>
                        <button (click)="setPageSize(24)">24</button>
                        <button (click)="setPageSize(48)">48</button>
                        <button (click)="setCustomPageSize($event)">...</button>
                    </div>
                </div>
                <div class="items">
                    @for (item of items(); track $index) {
                        <div class="item">
                            <div class="top">
                                <div class="image" [style]="`--image: url(${item.image})`"></div>
                                <p class="game-title" [title]="item.title">{{ item.title }}</p>
                            </div>
                            <div class="bottom">
                                <div class="user-count" [title]="`${item.owned} owned`">
                                    <owned-icon></owned-icon>
                                    <p>{{ item.owned }}</p>
                                </div>
                            </div>
                        </div>
                    }
                </div>
            </div>
            <div class="filters">

            </div>
        </div>
    </main>
</div>
