<form [formRoot]="request.field">
    <section>
        <label for="username">Username</label>
        <input type="text" id="username" [formField]="request.field.userName">
        <validation-message [field]="request.field.userName()"></validation-message>
    </section>
    <section>
        <label for="email">Email</label>
        <input type="text" id="email" [formField]="request.field.email">
        <validation-message [field]="request.field.email()"></validation-message>
    </section>
    <section>
        <label for="password">Password</label>
        <input type="text" id="password" [formField]="request.field.password">
        <validation-message [field]="request.field.password()"></validation-message>
    </section>
    <button type="submit" [disabled]="request.field().submitting()">Register</button>
    <a routerLink="/login" [class.disabled]="request.field().submitting()">Login</a>
</form>
