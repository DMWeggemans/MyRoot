<form [formRoot]="request.field">
    <section>
        <label for="user">User</label>
        <input type="text" id="user" [formField]="request.field.user">
        <validation-message [field]="request.field.user()"></validation-message>
    </section>
    <section>
        <label for="password">Password</label>
        <input type="text" id="password" [formField]="request.field.password">
        <validation-message [field]="request.field.password()"></validation-message>
    </section>
    <button type="submit">Login</button>
</form>
