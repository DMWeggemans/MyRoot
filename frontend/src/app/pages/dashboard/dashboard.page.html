<p>{{ user()?.id }}</p>
<p>{{ user()?.expiresOn }}</p>
<button type="submit" (click)="logout()">Logout</button>
<button type="button" (click)="steamService.popup()">Link Steam</button>
<button type="button" (click)="linkPlayStation.set(true)">Link PlayStation</button>
<link-steam [(response)]="linkSteam" />
<link-playstation [(isOpen)]="linkPlayStation" />
