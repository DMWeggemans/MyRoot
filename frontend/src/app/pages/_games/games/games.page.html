<div class="games-container">
    <div class="games-view">
        <game-pagination [filterResponse]="filterResponse()" [(filters)]="filters" (filtersChange)="waitAndGetGames()" />
        @if (isLoading() || !games().length) {
            <div class="games has-message">
                @if (isLoading()) {
                    <p class="games-message">Loading..</p>
                }
                @else if (!games().length) {
                    <p class="games-message">No games were found.</p>
                }
            </div>
        }
        @else {
            <div class="games">
                @for (game of games(); track $index) {
                    <game-card [game]="game"/>
                }
            </div>
        }
        <game-pagination [filterResponse]="filterResponse()" [(filters)]="filters" (filtersChange)="waitAndGetGames()" />
    </div>
    <game-filters [(filters)]="filters" (filtersChange)="waitAndGetGames()" />
</div>
